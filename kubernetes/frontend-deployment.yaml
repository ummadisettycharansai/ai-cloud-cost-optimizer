apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-frontend
  labels:
    app: finops-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finops-frontend
  template:
    metadata:
      labels:
        app: finops-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/username/ai-cloud-cost-optimizer-frontend:latest
        ports:
        - containerPort: 80
        env:
        - name: VITE_API_URL
          value: "http://api.finops.local"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: finops-frontend-svc
spec:
  selector:
    app: finops-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
