apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-backend
  labels:
    app: finops-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: finops-backend
  template:
    metadata:
      labels:
        app: finops-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/username/ai-cloud-cost-optimizer-backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: finops-secrets
        - configMapRef:
            name: finops-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: finops-backend-svc
spec:
  selector:
    app: finops-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
