name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (Frontend & Backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -- FRONTEND --
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend Security Scanning (npm audit)
        working-directory: ./frontend
        # Fails the pipeline if critical vulnerabilities are found
        run: npm audit --audit-level=critical

      # -- BACKEND --
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov bandit safety

      - name: Backend Security Scanning (Bandit & Safety)
        working-directory: ./backend
        run: |
          # Bandit: Python AST-based security scanner (skip tests dir)
          bandit -r . -x ./tests -lll  # Fail on High severity issues only
          
          # Safety: Check dependencies for security vulnerabilities
          # (Ignoring exit code to not block if free DB has false positives, or enforce it)
          # We'll run it as a check
          safety check --full-report || echo "Check safety report"

      - name: Run Backend Tests with Coverage Quality Gate
        working-directory: ./backend
        # Quality Gate: Fail pipeline if coverage is below 80%
        run: PYTHONPATH=. pytest --cov=. --cov-fail-under=80

      # -- SYSTEM SCANNING --
      - name: Security Scanning (Trivy Container/Filesystem Scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL'
          exit-code: 1

      # -- BUILD --
      - name: Build Frontend Project
        working-directory: ./frontend
        run: npm run build

  deploy-production:
    name: Deploy to Vercel
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        # Using working-directory for frontend
        # Only run if VERCEL_TOKEN is configured
        if: env.VERCEL_TOKEN != ''
        working-directory: ./frontend
        run: vercel pull --yes --environment=production --token=${{ env.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        # Only run if VERCEL_TOKEN is configured
        if: env.VERCEL_TOKEN != ''
        working-directory: ./frontend
        run: vercel build --prod --token=${{ env.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}

      - name: Deploy Project to Vercel
        # Only run if VERCEL_TOKEN is configured
        if: env.VERCEL_TOKEN != ''
        working-directory: ./frontend
        run: vercel deploy --prebuilt --prod --token=${{ env.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
